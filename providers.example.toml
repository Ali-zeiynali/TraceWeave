# TraceWeave v1.0.2 provider overrides
# -----------------------------------
# Normally you DO NOT need this file. Built-in presets activate automatically from .env:
#   GROQ_API_KEY / GROQ_API_KEY_2 / GROQ_API_KEY_3
#   GEMINI_API_KEY ...
#   MISTRAL_API_KEY ...
#   OPENROUTER_API_KEY ...
#   ZENMUX_API_KEY ...
#   SEEKROUTER_API_KEY ...
#   AGENTROUTER_API_KEY ...
#
# Use providers.toml only for a custom endpoint, a different model/task policy, or to override a built-in provider id.
# Raw keys are NEVER placed here; reference an environment variable.

[[providers]]
id = "custom-router"
driver = "openai_compat"
base_url = "https://router.example/v1"
enabled = true

[[providers.credentials]]
id = "token-1"
token_env = "CUSTOM_ROUTER_KEY_1"

[[providers.credentials]]
id = "token-2"
token_env = "CUSTOM_ROUTER_KEY_2"

[[providers.models]]
id = "fast"
name = "vendor/fast-model"
tasks = ["triage", "claim_extraction", "entity_extraction"]
capabilities = ["text", "json"]
credentials = ["token-1", "token-2"]
priority = 40
weight = 1.0
tier = "fast"

[[providers.models]]
id = "reasoner"
name = "vendor/reasoning-model"
tasks = ["planning", "replanning", "verification", "synthesis"]
capabilities = ["text", "json", "long_context"]
credentials = ["token-1"]
priority = 10
weight = 1.0
tier = "strong"

